[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "iboxed"
version = "0.1.0"
description = "Build pinned Idle bundles with iroll and publish them through GitHub CLI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
license = "BSD-3-Clause"
license-files = ["LICENSE"]

[project.scripts]
iboxed = "iboxed.cli:main"

[dependency-groups]
dev = [{include-group = "tests"}, "ruff>=0.12,<1"]
tests = ["pytest>=8,<10"]

[tool.hatch.build]
exclude = [".venv*", "__pycache__", ".pytest_cache", ".ruff_cache", "target", "*.pyc", "uv.lock", "dist"]

[tool.hatch.build.targets.wheel]
packages = ["src/iboxed"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src/iboxed", "tests", "docs", ".github", "README.md", "AGENTS.md", "IDLE.md",
    "LICENSE", "THIRD_PARTY.txt", "pyproject.toml", "config.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 119
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
